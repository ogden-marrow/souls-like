name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev pkg-config
      - name: Test
        run: cargo test --bins --locked
      - name: Build
        run: cargo build --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name=souls-like-${{ github.ref_name }}-${{ matrix.name }}
          mkdir dist
          cp target/release/souls-like LICENSE dist/
          (cd dist && zip -q "../$name.zip" *)
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "souls-like-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/souls-like.exe, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ASSET }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* \
            --repo "${{ github.repository }}" \
            --title "Souls-like ${{ github.ref_name }}" \
            --generate-notes \
            --notes "Prebuilt binaries for Linux (x86_64) and Windows (x86_64). Mods are not included. Linux: unzip, then run ./souls-like --install once to add it to your app menu. Windows: unzip and run souls-like.exe. Windows build is untested on real hardware."

  nexus:
    name: nexus (${{ matrix.game }}, ${{ matrix.os }})
    needs: publish
    if: vars.NEXUS_FILES != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(vars.NEXUS_FILES || '[{}]') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os }}
      - id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ matrix.mod_id }}
          file_id: ${{ matrix.file_id }}
          filename: souls-like-${{ github.ref_name }}-${{ matrix.os }}.zip
          version: ${{ steps.version.outputs.number }}
          update_mod_version: true
          archive_existing_version: true
          changelog: "Souls-like ${{ github.ref_name }}: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
