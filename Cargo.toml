[package]
name = "souls-like"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.36.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu"] }
