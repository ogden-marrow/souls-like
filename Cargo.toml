[package]
name = "souls-like"
version = "0.4.2"
edition = "2024"

[dependencies]
aes = "0.8"
cbc = "0.1"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "ico", "png"] }
pelite = "0.10.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
winreg = "0.56.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"


[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
